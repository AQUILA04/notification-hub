name: Maven clients

on:
  push:
    paths:
      - "mvn/**"
      - ".github/workflows/mvn-clients.yml"
  pull_request:
    paths:
      - "mvn/**"
      - ".github/workflows/mvn-clients.yml"
  workflow_dispatch:

concurrency:
  group: mvn-clients-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: mvn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mvn/pom.xml

      - name: Install
        run: mvn -B clean install

      - name: Upload Maven packages
        uses: actions/upload-artifact@v4
        with:
          name: sb-notification-hub-maven-${{ github.sha }}
          path: |
            mvn/sb-notification-hub-autoconfigure/target/sb-notification-hub-autoconfigure-*.jar
            mvn/sb-notification-hub-starter/target/sb-notification-hub-starter-*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !**/*-tests.jar
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to GitHub Packages
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: mvn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mvn/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy
        run: >
          mvn -B clean deploy
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
