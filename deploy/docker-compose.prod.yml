# PROD stack — project name: notification-hub-prod
# Hosts (OptimizeSolux convention):
#   notification.optimizesolux.com       → frontend (cockpit)
#   notification-api.optimizesolux.com   → API Spring Boot
#   notification-auth.optimizesolux.com  → Keycloak
# Start:
#   docker compose -f docker-compose.prod.yml --project-name notification-hub-prod \
#     --env-file /opt/notification-hub/prod/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-notification_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nhub} -d ${DB_NAME:-notification_hub} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  artemis:
    image: apache/activemq-artemis:2.40.0
    restart: unless-stopped
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?ARTEMIS_PASSWORD is required}
    networks:
      - internal

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2.5}
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-notification_hub}
      KC_DB_USERNAME: ${DB_USER:-nhub}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-notification-auth.optimizesolux.com}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    volumes:
      - ${KEYCLOAK_REALM_PATH:-/opt/notification-hub/deploy/keycloak/realm-notification-hub.json}:/opt/keycloak/data/import/realm-notification-hub.json:ro
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.nhub-prod-keycloak.rule=Host(`${KEYCLOAK_HOSTNAME:-notification-auth.optimizesolux.com}`)"
      - "traefik.http.routers.nhub-prod-keycloak.entrypoints=websecure"
      - "traefik.http.routers.nhub-prod-keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.nhub-prod-keycloak.loadbalancer.server.port=8080"

  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      artemis:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: "8088"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${DB_NAME:-notification_hub}
      POSTGRES_USER: ${DB_USER:-nhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      SMTP_HOST: ${MAIL_HOST:-smtp.resend.com}
      SMTP_PORT: ${MAIL_PORT:-465}
      SMTP_USER: ${MAIL_USER:-resend}
      SMTP_PASSWORD: ${MAIL_PASS:-}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://notification-auth.optimizesolux.com/realms/notification-hub}
      SMS_PROVIDER: ${SMS_PROVIDER:-afriksms}
      SMS_DEFAULT_FROM: ${SMS_DEFAULT_FROM:-}
      AFRIKSMS_CLIENT_ID: ${AFRIKSMS_CLIENT_ID:-}
      AFRIKSMS_API_KEY: ${AFRIKSMS_API_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      QUOTA_ENABLED: ${QUOTA_ENABLED:-true}
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://notification.optimizesolux.com}
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.nhub-prod-api.rule=Host(`${API_HOSTNAME:-notification-api.optimizesolux.com}`)"
      - "traefik.http.routers.nhub-prod-api.entrypoints=websecure"
      - "traefik.http.routers.nhub-prod-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.nhub-prod-api.loadbalancer.server.port=8088"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.nhub-prod-frontend.rule=Host(`${APP_HOSTNAME:-notification.optimizesolux.com}`)"
      - "traefik.http.routers.nhub-prod-frontend.entrypoints=websecure"
      - "traefik.http.routers.nhub-prod-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.nhub-prod-frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  internal:
    name: notification-hub-prod-internal
    external: true
  traefik-public:
    external: true
