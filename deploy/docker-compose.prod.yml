# PROD stack — project name: notification-hub-prod
# Hosts (OptimizeSolux convention):
#   notification.optimizesolux.com       → frontend (cockpit)
#   notification-api.optimizesolux.com   → API Spring Boot
# Auth (shared common-infra):
#   auth.optimizesolux.com/realms/notification-hub
#
# Prerequisite: optimize-common-infra running (redis, artemis, keycloak on optimizesolux-common).
# Start:
#   docker compose -f docker-compose.prod.yml --project-name notification-hub-prod \
#     --env-file /opt/notification-hub/prod/.env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-notification_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nhub} -d ${DB_NAME:-notification_hub} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      optimizesolux-common:
        aliases: ["notification-hub-db"]

  api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_PORT: "8088"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${DB_NAME:-notification_hub}
      POSTGRES_USER: ${DB_USER:-nhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: ${ARTEMIS_USER:-artemis}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?ARTEMIS_PASSWORD is required}
      SMTP_HOST: ${MAIL_HOST:-smtp.resend.com}
      SMTP_PORT: ${MAIL_PORT:-465}
      SMTP_USER: ${MAIL_USER:-resend}
      SMTP_PASSWORD: ${MAIL_PASS:-}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Port 465 = TLS implicite (SMTPS) : sans ssl.enable le client attend un accueil SMTP en clair et bloque
      # indéfiniment les listeners JMS (messages figés en QUEUED). SMTP_SSL=false si port 587 + SMTP_STARTTLS=true.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${SMTP_SSL:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${SMTP_TIMEOUT_MS:-15000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${SMTP_TIMEOUT_MS:-15000}
      # SMS test intercept (environment ≠ prod) — même SMTP Resend, boîte recette
      SMS_TEST_MAIL_FROM: ${SMS_TEST_MAIL_FROM:-noreply@optimizesolux.com}
      SMS_TEST_MAIL_TO: ${SMS_TEST_MAIL_TO:-sms@optimizesolux.com}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.optimizesolux.com/realms/notification-hub}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      SMS_PROVIDER: ${SMS_PROVIDER:-brevo}
      SMS_DEFAULT_FROM: ${SMS_DEFAULT_FROM:-OptimizeSLX}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_BASE_URL: ${BREVO_BASE_URL:-https://api.brevo.com/v3}
      BREVO_SMS_WEBHOOK_URL: ${BREVO_SMS_WEBHOOK_URL:-}
      AFRIKSMS_CLIENT_ID: ${AFRIKSMS_CLIENT_ID:-}
      AFRIKSMS_API_KEY: ${AFRIKSMS_API_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_OTP_CONTENT_SID: ${TWILIO_WHATSAPP_OTP_CONTENT_SID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_APP_ID: ${WHATSAPP_APP_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v25.0}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE_NAME: ${WHATSAPP_OTP_TEMPLATE_NAME:-}
      WHATSAPP_OTP_TEMPLATE_LANG: ${WHATSAPP_OTP_TEMPLATE_LANG:-fr}
      WHATSAPP_OTP_BUTTON: ${WHATSAPP_OTP_BUTTON:-copy_code}
      OTP_ENABLED: ${OTP_ENABLED:-true}
      OTP_PROVIDER: ${OTP_PROVIDER:-twilio-verify}
      OTP_DEFAULT_CHANNEL: ${OTP_DEFAULT_CHANNEL:-SMS}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      OTP_TWILIO_VERIFY_WHATSAPP_SMS_FALLBACK: ${OTP_TWILIO_VERIFY_WHATSAPP_SMS_FALLBACK:-true}
      QUOTA_ENABLED: ${QUOTA_ENABLED:-true}
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://notification.optimizesolux.com}
    networks:
      - optimizesolux-common
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.nhub-prod-api.rule=Host(`${API_HOSTNAME:-notification-api.optimizesolux.com}`)"
      - "traefik.http.routers.nhub-prod-api.entrypoints=websecure"
      - "traefik.http.routers.nhub-prod-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.nhub-prod-api.loadbalancer.server.port=8088"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.nhub-prod-frontend.rule=Host(`${APP_HOSTNAME:-notification.optimizesolux.com}`)"
      - "traefik.http.routers.nhub-prod-frontend.entrypoints=websecure"
      - "traefik.http.routers.nhub-prod-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.nhub-prod-frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  optimizesolux-common:
    external: true
  traefik-public:
    external: true
